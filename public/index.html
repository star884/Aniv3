<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto-Updating Anime Core</title>
    <style>
        body { background: #0f0f13; color: #fff; font-family: sans-serif; margin: 0; padding: 20px; }
        h1 { text-align: center; color: #ff4757; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; margin-top: 20px; }
        .card { background: #1e1e24; border-radius: 8px; overflow: hidden; cursor: pointer; transition: transform 0.2s; }
        .card:hover { transform: scale(1.05); }
        .card img { width: 100%; height: 260px; object-fit: cover; }
        .card-info { padding: 10px; font-size: 14px; text-align: center; font-weight: bold; }
        #player-container { display: none; margin: 20px auto; max-width: 800px; text-align: center; }
        video { width: 100%; border-radius: 8px; background: #000; }
        .close-btn { background: #ff4757; border: none; color: white; padding: 10px 20px; cursor: pointer; margin-bottom: 10px; border-radius: 4px; }
    </style>
</head>
<body>

    <h1>Automated Anime Stream Station</h1>
    
    <div id="player-container">
        <button class="close-btn" onclick="closePlayer()">✕ Close Video</button>
        <video id="video-player" controls autoplay></video>
        <h3 id="playing-title"></h3>
    </div>

    <div class="grid" id="library-grid"><!-- Dynamic items insert here --></div>

    <script>
        async function loadLibrary() {
            const grid = document.getElementById('library-grid');
            try {
                const res = await fetch('/api/library');
                const json = await res.json();
                
                if(json.success) {
                    grid.innerHTML = json.data.map(anime => `
                        <div class="card" onclick="watchAnime('${anime.id}', '${escape(anime.title)}')">
                            <img src="${anime.poster}" alt="${anime.title}">
                            <div class="card-info">${anime.title}</div>
                        </div>
                    `).join('');
                }
            } catch (err) {
                grid.innerHTML = "<p>Failed syncing database with Stremio provider feed.</p>";
            }
        }

        async function watchAnime(id, title) {
            const container = document.getElementById('player-container');
            const player = document.getElementById('video-player');
            const titleHeader = document.getElementById('playing-title');
            
            titleHeader.innerText = `Loading links for: ${unescape(title)}...`;
            container.style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });

            try {
                const res = await fetch(`/api/stream/${id}`);
                const json = await res.json();

                if (json.success && json.streams.length > 0) {
                    titleHeader.innerText = `Now Playing: ${unescape(title)}`;
                    player.src = json.streams[0].url; 
                } else {
                    alert("No responsive non-torrent links found for this title.");
                    closePlayer();
                }
            } catch (err) {
                alert("Network communication error.");
                closePlayer();
            }
        }

        function closePlayer() {
            const container = document.getElementById('player-container');
            const player = document.getElementById('video-player');
            player.pause();
            player.src = "";
            container.style.display = 'none';
        }

        // Initialize library sync on mount
        loadLibrary();
    </script>
</body>
</html>
