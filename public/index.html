<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Stream Engine</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; text-align: center; padding: 20px; }
        .container { max-width: 800px; margin: auto; }
        select, button { padding: 10px; margin: 10px; background: #222; color: #fff; border: 1px solid #444; border-radius: 4px; cursor: pointer; }
        video { width: 100%; max-width: 760px; background: #000; border-radius: 8px; margin-top: 15px; }
        .stream-option { padding: 12px; background: #1e1e1e; margin: 8px auto; max-width: 760px; cursor: pointer; border-radius: 4px; text-align: left; border: 1px solid #333; }
        .stream-option:hover { background: #292929; border-color: #555; }
    </style>
</head>
<body>

<div class="container">
    <h1>Anime Stream Engine</h1>
    <p>Secure Node Backend Architecture (Non-Torrent)</p>

    <div>
        <label for="animeId">Select Anime Title:</label>
        <select id="animeId">
            <option value="tt22765314">Frieren: Beyond Journey's End (S1 Ep1)</option>
            <option value="tt0434706">Naruto (S1 Ep1)</option>
            <option value="tt15320550">Chainsaw Man (S1 Ep1)</option>
        </select>
        <button onclick="fetchAnimeStreams()">Find Video Streams</button>
    </div>

    <div id="loading" style="display:none;">Querying secure backend proxy...</div>
    <div id="streamList"></div>

    <video id="videoPlayer" controls></video>
</div>

<script>
async function fetchAnimeStreams() {
    const animeId = document.getElementById('animeId').value;
    const streamListDiv = document.getElementById('streamList');
    const loadingDiv = document.getElementById('loading');
    
    streamListDiv.innerHTML = "";
    loadingDiv.style.display = "block";

    try {
        // Fetch streams from your OWN backend endpoint instead of Stremio directly
        const response = await fetch(`/api/streams/${animeId}`);
        const data = await response.json();
        loadingDiv.style.display = "none";

        if (data.error || !data.streams || data.streams.length === 0) {
            streamListDiv.innerHTML = "<p>No secure direct streaming sources found for this title.</p>";
            return;
        }

        data.streams.forEach((stream, index) => {
            const streamEl = document.createElement('div');
            streamEl.className = 'stream-option';
            streamEl.innerHTML = `<strong>Source ${index + 1}:</strong> ${stream.title || 'Direct Video Server'} <br><small>${stream.name || ''}</small>`;
            
            streamEl.onclick = () => playVideo(stream.url);
            streamListDiv.appendChild(streamEl);
        });

    } catch (error) {
        loadingDiv.style.display = "none";
        streamListDiv.innerHTML = `<p style="color:red;">Error communicating with server: ${error.message}</p>`;
    }
}

function playVideo(videoUrl) {
    const video = document.getElementById('videoPlayer');
    
    if (videoUrl.includes('.m3u8')) {
        if (Hls.isSupported()) {
            const hls = new Hls();
            hls.loadSource(videoUrl);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = videoUrl;
            video.play();
        }
    } else {
        video.src = videoUrl;
        video.play();
    }
}
</script>

</body>
</html>
