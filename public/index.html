<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Custom Anime Stream Web Client</title>
    <!-- Include a modern web video player like Plyr -->
    <link rel="stylesheet" href="https://plyr.io" />
</head>
<body>

    <div style="max-width: 800px; margin: 20px auto; text-align: center;">
        <h2>Custom Anime Stream UI</h2>
        <button id="loadStream">Play Episode 1 (via Addon API)</button>
        <br><br>
        
        <!-- Video Container -->
        <video id="player" playsinline controls></video>
    </div>

    <script src="https://plyr.io"></script>
    <script>
        const player = new Plyr('#player');

        document.getElementById('loadStream').addEventListener('click', async () => {
            // 1. Target a public non-torrent stream addon endpoint 
            // Syntax: https://[addon-domain]/stream/{type}/{id}.json
            const ADDON_STREAM_API = "https://superflixapi.xyz"; 

            try {
                // 2. Fetch the JSON stream payload directly from the Stremio Addon
                const response = await fetch(ADDON_STREAM_API);
                const data = await response.json();

                if (data.streams && data.streams.length > 0) {
                    // 3. Extract the direct HTTP/HLS stream URL (preferring non-torrent links)
                    const directStreamUrl = data.streams[0].url; 
                    
                    console.log("Found direct web stream:", directStreamUrl);

                    // 4. Feed the URL directly into your website's HTML5 Player
                    document.getElementById('player').src = directStreamUrl;
                    player.play();
                } else {
                    alert("No direct web streams found for this ID.");
                }
            } catch (error) {
                console.error("Error communicating with Stremio Addon API:", error);
            }
        });
    </script>
</body>
</html>
